<!doctype html><html lang="da"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Udgivet skema — Demo Lægehus</title>
<style>
:root{--gr:#0b5e58;--gr2:#0f766e;--acc:#14603d;--bg:#eef2f0;--kort:#fff;
 --kant:#e3e9e6;--tekst:#16232f;--daemp:#5c6b7a;
 --a1:#0f766e;--a1b:rgba(15,118,110,.12);--a2:#7c3aed;--a2b:rgba(124,58,237,.12);
 --sup:#2563eb;--supb:rgba(37,99,235,.12);--vagt:#c2410c;--vagtb:rgba(194,65,12,.12);
 --udd:#0891b2;--uddb:rgba(8,145,178,.12);--fri:#64748b;--frib:rgba(100,116,139,.14);
 --idag:#fffbeb;--idagk:#f59e0b}
*{box-sizing:border-box}
/* Lås vandret scroll — ellers kan iOS Safari "glide" siden sidelæns (elastik-
   scroll), selv når indholdet passer. clip vinder i moderne browsere og
   bryder ikke position:sticky; hidden er fallback for ældre. */
html,body{overflow-x:hidden;overflow-x:clip;max-width:100%}
body{margin:0;background:var(--bg);color:var(--tekst);
 font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;font-size:14px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px 48px}
header{background:linear-gradient(135deg,var(--gr),var(--gr2));color:#fff;
 padding:22px 20px;border-radius:0 0 16px 16px;box-shadow:0 6px 18px -8px rgba(11,94,88,.6)}
header .in{max-width:1080px;margin:0 auto}
h1{margin:0 0 3px;font-size:21px;letter-spacing:-.2px}
.periode{opacity:.92;font-size:13.5px}
.badge{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);
 border-radius:999px;padding:2px 11px;font-size:12px;font-weight:600;margin-top:8px}
.bar{position:sticky;top:0;z-index:5;background:rgba(238,242,240,.94);backdrop-filter:blur(6px);
 display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 0;margin-bottom:6px}
.seg{display:inline-flex;background:var(--kort);border:1px solid var(--kant);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;font:inherit;font-weight:600;color:var(--daemp);
 padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--gr);color:#fff}
select,.knap{font:inherit;font-weight:600;border:1px solid var(--kant);background:var(--kort);
 color:var(--tekst);border-radius:10px;padding:8px 12px;cursor:pointer}
.knap.primary{background:var(--gr);color:#fff;border-color:var(--gr)}
.spacer{flex:1}.tael{color:var(--daemp);font-size:12.5px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:2px 0 14px;font-size:12.5px;color:var(--daemp)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:11px;height:11px;border-radius:3px;display:inline-block}
.uge{margin:18px 0 8px;font-size:12px;font-weight:700;color:var(--daemp);
 text-transform:uppercase;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
.uge::after{content:"";flex:1;height:1px;background:var(--kant)}
.dag{background:var(--kort);border:1px solid var(--kant);border-radius:12px;padding:12px 14px;
 margin-bottom:9px;display:grid;grid-template-columns:132px 1fr auto;gap:12px;align-items:center;
 transition:box-shadow .15s}
.dag:hover{box-shadow:0 4px 14px -6px rgba(15,23,42,.18)}
.dag.idag{background:var(--idag);border-color:var(--idagk);box-shadow:0 0 0 1px var(--idagk) inset}
.dag.lukket{opacity:.6}
.dato{font-weight:700}
.dato small{display:block;color:var(--daemp);font-weight:500;font-size:11.5px;margin-top:1px}
.idag-mrk{display:inline-block;background:var(--idagk);color:#fff;font-size:10px;font-weight:800;
 border-radius:5px;padding:1px 6px;margin-top:4px}
.rolle-linje{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.chip{display:inline-flex;align-items:stretch;border-radius:999px;font-size:12px;font-weight:700;
 overflow:hidden;border:1px solid rgba(15,23,42,.10)}
.chip .k{padding:2px 7px;color:#fff;font-size:11px;letter-spacing:.2px;display:flex;align-items:center}
.chip .v{padding:2px 8px;background:#fff;display:flex;align-items:center}
.chip.a1 .k{background:var(--a1)}.chip.a1{background:var(--a1b);color:var(--a1)}
.chip.a2 .k{background:var(--a2)}.chip.a2{background:var(--a2b);color:var(--a2)}
.chip.sup .k{background:var(--sup)}.chip.sup{background:var(--supb);color:var(--sup)}
.chip.vagt .k{background:var(--vagt)}.chip.vagt{background:var(--vagtb);color:var(--vagt)}
.chip.udd .k{background:var(--udd)}.chip.udd{background:var(--uddb);color:var(--udd)}
.chip.fri .k{background:var(--fri)}.chip.fri{background:var(--frib);color:var(--fri)}
.note{font-size:12px;color:#92400e;background:#fef3c7;border-radius:7px;padding:2px 8px;
 display:inline-block;margin-top:5px}
.oevr{font-size:12px;color:var(--daemp);margin-top:4px}.oevr b{color:var(--tekst);font-weight:600}
.bem{justify-self:end;text-align:center;min-width:52px}
.bem .n{font-size:18px;font-weight:800;color:var(--gr)}
.bem.u .n{color:#b91c1c}
.bem .l{font-size:10px;color:var(--daemp);text-transform:uppercase;letter-spacing:.4px}
.dim{opacity:.3}.mark{outline:2px solid var(--gr);outline-offset:1px}
.luk-txt{color:var(--daemp);font-style:italic}
.minplan{background:var(--kort);border:1px solid var(--kant);border-left:4px solid var(--gr);
 border-radius:12px;padding:14px 16px;margin-bottom:12px;display:none}
.minplan.vis{display:block}
.minplan h2{margin:0 0 4px;font-size:16px;color:var(--acc)}
.minplan .sub{color:var(--daemp);font-size:12.5px;margin-bottom:10px}
.mpqr{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.mpqr img{width:104px;height:104px;border:1px solid var(--kant);border-radius:10px;background:#fff;padding:5px}
.abon{background:var(--kort);border:1px solid var(--kant);border-radius:12px;padding:16px;margin-top:22px}
.abon h3{margin:0 0 4px;font-size:15px;color:var(--acc)}
.abon p{margin:0 0 12px;color:var(--daemp);font-size:12.5px}
.abon-grid{display:flex;flex-wrap:wrap;gap:10px}
.abon-kort{border:1px solid var(--kant);border-radius:10px;padding:10px;text-align:center;width:120px}
.abon-kort img{width:96px;height:96px;display:block;margin:0 auto 6px}
.abon-knap{display:inline-flex;align-items:center;gap:6px;background:var(--a1b);color:var(--a1);
 border:1px solid rgba(15,118,110,.25);border-radius:9px;padding:6px 10px;font-weight:700;
 font-size:13px;text-decoration:none;justify-content:center;width:100%}
.kopi{display:block;margin-top:6px;font-size:11px;color:var(--daemp);cursor:pointer;
 background:none;border:0;text-decoration:underline}
.foot{color:var(--daemp);font-size:11.5px;margin-top:20px;text-align:center}
@media(max-width:640px){.dag{grid-template-columns:1fr;gap:7px}
 .bem{justify-self:start;display:flex;gap:6px;align-items:baseline}.bar{position:static}}
@media print{.bar,.abon,.minplan .mpqr{display:none!important}.dag{break-inside:avoid}}
</style></head><body>

</div></header>
<div class="wrap">

  <div class="abon-grid" id="abonGrid"></div>

</div>

const M = DATA.meta, DAGE = DATA.dage;
const e = s => (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function iso2(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
const IDAG = iso2();
function icsAbs(ini){return new URL("kalender/"+ini+".ics",location.href).href;}
function webcal(ini){return icsAbs(ini).replace(/^https?:/,"webcal:");}
let mode="alle", valgt=localStorage.getItem("praksisplan_mig")||"";

function chip(cls,k,v,st){return '<span class="chip '+cls+(st||"")+'"><span class="k">'+e(k)+'</span><span class="v">'+e(v)+'</span></span>';}
function bem(d){return d.bem!=null?d.bem:(d.roller.length+d.vagter.length+d.oevrige.length);}

function dagKort(d){
 const iMin = mode==="min" && valgt;
 if(d.lukket){
  return '<div class="dag lukket"><div class="dato">'+e(d.ugedag)+'<small>'+e(d.dato)+'</small></div>'
    +'<div class="luk-txt">Lukket'+(d.lukket_label?" — "+e(d.lukket_label):"")+'</div><div></div></div>';
 }
 const rel = x => valgt && x===valgt;
 const st = x => rel(x)?" mark":(iMin?" dim":"");
 let c="";
 d.roller.forEach((r,i)=>{ if(!r.holder)return;
   c+=chip(i===0?"a1":"a2", r.label, r.holder, st(r.holder)); });
 if(M.sup_aktiv && d.sup) c+=chip("sup", M.sup_navn, d.sup, st(d.sup));
 d.funk.forEach(f=>{const p=f.split(":");const ini=(p[0]||"").trim();const lab=(p[1]||f).trim();

 d.vagter.forEach(v=>{c+=chip("vagt", v.kort||"Vagt", v.laege, st(v.laege));});
 d.fravaer.forEach(f=>{c+=chip("fri","Fravær",f, st(f));});
 d.udd.forEach(uu=>{const ini=String(uu).split(":")[0].trim();c+=chip("udd","UDD",ini, st(ini));});

  +(d.oevrige.length?'<div class="oevr">Øvrige: '+oevr+'</div>':"")+'</div>'
  +'<div class="bem'+u+'"><div class="n">'+bem(d)+'</div><div class="l">i huset</div></div></div>';

function render(){
 const L=document.getElementById("liste"); L.innerHTML="";
 let uge=null, vist=0;

   const paa=[...d.roller.map(r=>r.holder),d.sup,...d.funk.map(f=>f.split(":")[0].trim()),
     ...d.vagter.map(v=>v.laege),...d.fravaer,...d.udd.map(x=>String(x).split(":")[0].trim()),...d.oevrige];

  }
  if(d.uge!==uge){uge=d.uge;L.insertAdjacentHTML("beforeend",'<div class="uge">Uge '+e(uge)+'</div>');}

 });

 const mp=document.getElementById("minplan");
 if(mode==="min" && valgt){
  const mine=DAGE.filter(d=>!d.lukket && [...d.roller.map(r=>r.holder),d.sup,...d.funk.map(f=>f.split(":")[0].trim()),...d.vagter.map(v=>v.laege),...d.fravaer,...d.udd.map(x=>String(x).split(":")[0].trim()),...d.oevrige].includes(valgt));
  const roller=mine.filter(d=>d.roller.some(r=>r.holder===valgt)||d.sup===valgt).length;
  const qr = M.har_qr?'<img src="qr/'+encodeURIComponent(valgt)+'.svg" alt="QR til '+e(valgt)+'">':"";
  mp.className="minplan vis";
  mp.innerHTML='<h2>👤 Min plan — '+e(valgt)+'</h2>'
    +'<div class="sub">'+mine.length+' dage på arbejde i perioden · '+roller+' dage med rolle. Dine dage er fremhævet nedenfor.</div>'
    +'<div class="mpqr">'+qr+'<a class="abon-knap" style="width:auto" href="'+webcal(valgt)+'">📅 Abonnér på '+e(valgt)+'s kalender</a></div>';
 } else mp.className="minplan";
}

function init(){
 document.getElementById("hNavn").textContent=M.navn;
 document.getElementById("hPeriode").textContent="Skema for "+M.fra+" – "+M.til+" · udgivet "+M.udgivet;
 document.getElementById("foot").textContent=M.navn+" · Praksisplan"+(M.licens?" · "+M.licens:"");
 document.getElementById("legend").innerHTML=
  '<span><i class="dot" style="background:var(--a1)"></i>'+e(M.primaer_rolle||"A1")+'</span>'
  +'<span><i class="dot" style="background:var(--a2)"></i>Øvrige roller</span>'
  +(M.sup_aktiv?'<span><i class="dot" style="background:var(--sup)"></i>'+e(M.sup_navn)+'</span>':"")
  +'<span><i class="dot" style="background:var(--vagt)"></i>Vagt / funktion</span>'
  +'<span><i class="dot" style="background:var(--fri)"></i>Fravær</span>'
  +'<span><i class="dot" style="background:var(--idagk)"></i>I dag</span>';
 const s=document.getElementById("vaelg");
 M.initialer.forEach(l=>{const o=document.createElement("option");o.value=l;o.textContent=l;s.appendChild(o);});
 if(valgt) s.value=valgt;
 document.getElementById("abonGrid").innerHTML=M.initialer.map(l=>
   '<div class="abon-kort">'+(M.har_qr?'<img src="qr/'+encodeURIComponent(l)+'.svg" alt="QR '+e(l)+'">':"")
   +'<a class="abon-knap" href="'+webcal(l)+'">📅 '+e(l)+'</a>'
   +'<button class="kopi" data-ini="'+e(l)+'">kopiér adresse</button></div>').join("");
 document.getElementById("abonGrid").addEventListener("click",ev=>{
   const b=ev.target.closest(".kopi"); if(!b)return;
   const t=icsAbs(b.dataset.ini);
   if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>{b.textContent="kopieret ✓";setTimeout(()=>b.textContent="kopiér adresse",1500);});
 });
 document.getElementById("bAlle").onclick=()=>{mode="alle";document.getElementById("bAlle").classList.add("on");document.getElementById("bMin").classList.remove("on");render();};
 document.getElementById("bMin").onclick=()=>{mode="min";document.getElementById("bMin").classList.add("on");document.getElementById("bAlle").classList.remove("on");render();};
 s.onchange=()=>{valgt=s.value;if(valgt)localStorage.setItem("praksisplan_mig",valgt);render();};
 document.getElementById("idagBtn").onclick=()=>{const el=document.querySelector(".dag.idag");if(el)el.scrollIntoView({behavior:"smooth",block:"center"});else alert("I dag er ikke i den udgivne periode.");};
 render();
}
init();
</script></body></html>
